spring.application.name=optimizador-envios-backend

# Load .env file from project root (do NOT commit .env)
spring.config.import=optional:file:.env[.properties]

# OpenRouteService — reads ORS_API_KEY from .env or from OS environment
openrouteservice.api-key=${ORS_API_KEY:YOUR_API_KEY_HERE}

# Configuración de proveedores de envío
# FedEx - eficiente en largas distancias, rápido pero no dominante
proveedores.fedex.costo-base=35000
proveedores.fedex.precio-por-kg=1200
proveedores.fedex.precio-por-km=60
proveedores.fedex.km-por-dia=480

# DHL - balanceado, competitivo en media distancia
proveedores.dhl.costo-base=14000
proveedores.dhl.precio-por-kg=1500
proveedores.dhl.precio-por-km=100
proveedores.dhl.km-por-dia=430

# Local - ideal para trayectos cortos
proveedores.local.costo-base=2000
proveedores.local.precio-por-kg=2000
proveedores.local.precio-por-km=150
proveedores.local.km-por-dia=260


name: CI / CD

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar build tool
        id: tool
        run: |
          if [[ -f pom.xml ]]; then
            echo "name=maven" >> "$GITHUB_OUTPUT"
          elif [[ -f build.gradle || -f build.gradle.kts ]]; then
            echo "name=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No se encontró pom.xml ni ningún archivo build.gradle."
            exit 1
          fi

      - name: Set up Java 21 — Temurin
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ steps.tool.outputs.name }}

      - name: Permisos Gradle wrapper
        if: steps.tool.outputs.name == 'gradle'
        run: chmod +x ./gradlew

      - name: Permisos Maven wrapper
        if: steps.tool.outputs.name == 'maven'
        run: chmod +x ./mvnw

      - name: Ejecutar tests — Gradle
        if: steps.tool.outputs.name == 'gradle'
        run: ./gradlew test --no-daemon --console=plain
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}

      - name: Ejecutar tests — Maven
        if: steps.tool.outputs.name == 'maven'
        run: ./mvnw --batch-mode test
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}

  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir nombre de imagen GHCR
        id: image_name
        run: |
          echo "value=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.value }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
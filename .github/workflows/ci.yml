name: CI / CD

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Tests
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: "Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detecta automáticamente si el proyecto usa Maven o Gradle
      - name: Detectar build tool
        id: tool
        run: |
          if [[ -f pom.xml ]]; then
            echo "name=maven" >> "$GITHUB_OUTPUT"
          elif [[ -f build.gradle || -f build.gradle.kts ]]; then
            echo "name=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No se encontró pom.xml ni ningún archivo build.gradle."
            exit 1
          fi

      - name: Set up Java 21 — Temurin
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          # El parámetro 'cache' acepta 'maven' o 'gradle' según lo detectado
          cache: ${{ steps.tool.outputs.name }}

      - name: Permisos Gradle wrapper
        if: steps.tool.outputs.name == 'gradle'
        run: chmod +x ./gradlew

      - name: Ejecutar tests — Gradle
        if: steps.tool.outputs.name == 'gradle'
        run: ./gradlew test --no-daemon --console=plain
        env:
          # Referencia al secret; si no existe en el repo usa el valor por
          # defecto definido en application.properties (YOUR_API_KEY_HERE)
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}

      - name: Ejecutar tests — Maven
        if: steps.tool.outputs.name == 'maven'
        run: ./mvnw --batch-mode test
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Docker build & push (solo si tests pasan)
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: "Docker — Build & Push"
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write   # Necesario para publicar en GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login solo en push (los PRs de forks no tienen permisos de escritura)
      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera dos tags:
      #   - latest   → solo en push a la rama main
      #   - sha-<7hex> → en todos los eventos (build + push)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          # En push → sube la imagen; en PR → solo verifica que construye
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché de capas entre ejecuciones (GitHub Actions Cache)
          cache-from: type=gha
          cache-to: type=gha,mode=max
